<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img"><title>draft's compiler as a composite</title><desc>Source flows top to bottom through Parse, Resolve, Lower, Finalize and Validate to a plan. Compile is the composite of these five arrows.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><path class="w" d="M340 30 L340 60"/><text class="l" x="350" y="48" text-anchor="start">Source (text)</text><g class="p"><rect x="240" y="60" width="200" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="75.0" text-anchor="middle" dominant-baseline="central">Parse</text><text class="t2" x="340.0" y="94.0" text-anchor="middle" dominant-baseline="central">participle: text → AST</text></g><path class="w" d="M340 108 L340 132"/><g class="p"><rect x="240" y="132" width="200" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="147.0" text-anchor="middle" dominant-baseline="central">Resolve</text><text class="t2" x="340.0" y="166.0" text-anchor="middle" dominant-baseline="central">names, arity, types</text></g><path class="w" d="M340 180 L340 204"/><g class="p"><rect x="240" y="204" width="200" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="219.0" text-anchor="middle" dominant-baseline="central">Lower</text><text class="t2" x="340.0" y="238.0" text-anchor="middle" dominant-baseline="central">pipe → ;, par → ⊗</text></g><path class="w" d="M340 252 L340 276"/><g class="p"><rect x="240" y="276" width="200" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="291.0" text-anchor="middle" dominant-baseline="central">Finalize</text><text class="t2" x="340.0" y="310.0" text-anchor="middle" dominant-baseline="central">fragment → plan</text></g><path class="w" d="M340 324 L340 348"/><g class="p"><rect x="240" y="348" width="200" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="340.0" y="363.0" text-anchor="middle" dominant-baseline="central">Validate</text><text class="t2" x="340.0" y="382.0" text-anchor="middle" dominant-baseline="central">graph shape, no cycles</text></g><path class="w" d="M340 396 L340 430" marker-end="url(#a)"/><text class="l" x="350" y="420" text-anchor="start">plan.Plan</text><text class="f" x="340" y="462" text-anchor="middle">compile = Parse ; Resolve ; Lower ; Finalize ; Validate   (weft.Pipe5)</text><text class="l" x="340" y="486" text-anchor="middle">Pure: no step runs anything. Same source, same plan, byte for byte.</text></svg>
